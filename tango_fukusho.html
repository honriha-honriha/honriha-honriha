<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>単語復唱トレーニング</title>
<style>
  :root {
    --sumi: #1c1c1e;
    --washi: #f7f3e9;
    --shu: #c1440e;
    --ai: #2a4d5e;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--washi);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.02) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0, transparent 40%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    color: var(--sumi);
    overflow: hidden;
  }

  /* ---- setup screen ---- */
  .setup {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3vh;
    background: #fffdf8;
    border: 1px solid rgba(28,28,30,0.2);
    padding: 5vh 6vw;
    min-width: 320px;
    max-width: 640px;
  }
  .setup h1 {
    font-size: min(3vw, 3vh, 26px);
    letter-spacing: 0.15em;
    margin: 0 0 1vh 0;
    font-weight: normal;
    color: var(--sumi);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 0.8vh;
    width: 100%;
  }
  .field span {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: min(1.5vw, 1.5vh, 14px);
    letter-spacing: 0.1em;
    color: var(--ai);
  }
  select {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: min(2vw, 2vh, 18px);
    padding: 1vh 1vw;
    border: 1px solid rgba(28,28,30,0.4);
    background: var(--washi);
    color: var(--sumi);
    min-width: 260px;
  }

  /* ---- mora checkbox group ---- */
  .checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 1vh 1vw;
    justify-content: center;
  }
  .checkbox-group label {
    display: flex;
    align-items: center;
    gap: 0.5vw;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: min(1.8vw, 1.8vh, 16px);
    color: var(--sumi);
    cursor: pointer;
    border: 1px solid rgba(28,28,30,0.35);
    padding: 1vh 1.2vw;
    background: var(--washi);
    user-select: none;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .checkbox-group label:has(input:checked) {
    background: var(--ai);
    border-color: var(--ai);
    color: var(--washi);
  }
  .checkbox-group input[type="checkbox"] {
    accent-color: var(--shu);
    width: 1.1em;
    height: 1.1em;
  }

  .hint {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: min(1.2vw, 1.2vh, 12px);
    color: rgba(28,28,30,0.5);
    text-align: center;
    line-height: 1.6;
  }

  /* ---- training screen ---- */
  .training {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stage {
    position: relative;
    width: min(94vw, 78vh);
    height: min(56vw, 50vh);
    border: 1px solid rgba(28,28,30,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fffdf8;
    padding: 2vw 3vw;
    box-sizing: border-box;
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 2.2%;
    border: 1px solid rgba(28,28,30,0.12);
    pointer-events: none;
  }
  #char {
    line-height: 1.2;
    color: var(--sumi);
    transition: opacity 0.4s ease;
    text-align: center;
    white-space: nowrap;
  }
  #char.fade {
    opacity: 0;
  }
  #char.done-label {
    font-size: min(6vw, 6vh, 48px) !important;
    color: var(--shu);
  }
  .counter {
    margin-top: 3vh;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: min(2vw, 2vh, 20px);
    letter-spacing: 0.15em;
    color: rgba(28,28,30,0.5);
  }
  .controls {
    margin-top: 5vh;
    display: flex;
    gap: 2vw;
  }
  button {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: min(2.4vw, 2.4vh, 22px);
    letter-spacing: 0.1em;
    padding: 1.4vh 3vw;
    border: 1px solid var(--sumi);
    background: transparent;
    color: var(--sumi);
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  button:hover {
    background: var(--sumi);
    color: var(--washi);
  }
  button.primary {
    border-color: var(--shu);
    color: var(--shu);
  }
  button.primary:hover {
    background: var(--shu);
    color: var(--washi);
  }
</style>
</head>
<body>

<div class="setup" id="setup">
  <h1>単語復唱トレーニング設定</h1>

  <div class="field">
    <span>提示間隔</span>
    <select id="intervalSelect">
      <option value="500">0.5秒</option>
      <option value="800">0.8秒</option>
      <option value="1000">1秒</option>
      <option value="1500">1.5秒</option>
      <option value="2000" selected>2秒</option>
      <option value="2500">2.5秒</option>
      <option value="3000">3秒</option>
      <option value="4000">4秒</option>
      <option value="5000">5秒</option>
    </select>
  </div>

  <div class="field">
    <span>音の種類</span>
    <div class="checkbox-group" id="typeGroup">
      <label><input type="checkbox" value="no_bilabial" checked>両唇音なし</label>
      <label><input type="checkbox" value="initial" checked>語頭のみ両唇音</label>
      <label><input type="checkbox" value="mid" checked>語中・語尾に両唇音</label>
    </div>
  </div>

  <div class="field">
    <span>読み上げ</span>
    <select id="readModeSelect">
      <option value="word" selected>単語</option>
      <option value="word_plus_mora">単語+語頭1モーラ</option>
      <option value="mora_only">語頭1モーラ</option>
      <option value="two_mora_only">語頭2モーラ</option>
    </select>
  </div>

  <div class="field">
    <span>読み上げスピード</span>
    <select id="rateSelect">
      <option value="0.8">はやめ</option>
      <option value="0.7" selected>ふつう</option>
      <option value="0.5">ゆっくり</option>
      <option value="0.3">とてもゆっくり</option>
    </select>
  </div>

  <div class="field">
    <span>モーラ数</span>
    <div class="checkbox-group" id="moraGroup">
      <label><input type="checkbox" value="2" checked>2</label>
      <label><input type="checkbox" value="3" checked>3</label>
      <label><input type="checkbox" value="4" checked>4</label>
      <label><input type="checkbox" value="5" checked>5</label>
      <label><input type="checkbox" value="6" checked>6</label>
      <label><input type="checkbox" value="7" checked>7以上</label>
    </div>
  </div>

  <div class="field">
    <span>回数</span>
    <select id="countSelect">
      <option value="30">30回</option>
      <option value="50" selected>50回</option>
      <option value="100">100回</option>
      <option value="150">150回</option>
      <option value="200">200回</option>
      <option value="300">300回</option>
      <option value="500">500回</option>
    </select>
  </div>

  <button class="primary" id="startSetupBtn">開始</button>
  <div class="hint" id="hint"></div>
</div>

<div class="training" id="training" style="display:none;">
  <div class="stage">
    <div id="char"></div>
  </div>
  <div class="counter" id="counter"></div>
  <div class="controls">
    <button class="primary" id="toggleBtn">一時停止</button>
    <button id="textToggleBtn">文字表示 OFF</button>
    <button id="backBtn">設定に戻る</button>
  </div>
</div>

    if (readMode === 'word_plus_mora') {
      queue = [text, mora];
    } else if (readMode === 'mora_only') {
      queue = [mora];
    } else if (readMode === 'two_mora_only') {
      queue = [firstTwoMorae(text)];
    } else {
      queue = [text];
    }
    playQueue(queue);
  }

  const stageEl = document.querySelector('.stage');

  // 枠の中に収まる最大のフォントサイズを二分探索で求める
  function fitTextToStage() {
    const availW = stageEl.clientWidth - 2 * (stageEl.clientWidth * 0.03) - 8;
    const availH = stageEl.clientHeight - 2 * (stageEl.clientWidth * 0.02) - 8;
    let lo = 10, hi = 600;
    charEl.style.fontSize = hi + 'px';
    while (hi - lo > 1) {
      const mid = Math.floor((lo + hi) / 2);
      charEl.style.fontSize = mid + 'px';
      if (charEl.scrollWidth <= availW && charEl.scrollHeight <= availH) {
        lo = mid;
      } else {
        hi = mid;
      }
    }
    charEl.style.fontSize = lo + 'px';
  }

  function applyTextVisibility() {
    charEl.style.visibility = (isDone || showText) ? 'visible' : 'hidden';
  }

  function render() {
    const word = order[index];
    isDone = false;
    charEl.classList.add('fade');
    setTimeout(() => {
      charEl.classList.remove('done-label');
      charEl.textContent = word;
      fitTextToStage();
      charEl.classList.remove('fade');
      applyTextVisibility();
      speak(word);
    }, 200);
    counterEl.textContent = `${index + 1} / ${order.length}`;
  }

  function advance() {
    if (index < order.length - 1) {
      index++;
      render();
    } else {
      stop();
      isDone = true;
      charEl.classList.remove('fade');
      charEl.classList.add('done-label');
      charEl.style.fontSize = '';
      charEl.textContent = '完了';
      applyTextVisibility();
      toggleBtn.textContent = '開始';
      toggleBtn.disabled = true;
    }
  }

  function start() {
    running = true;
    toggleBtn.disabled = false;
    toggleBtn.textContent = '一時停止';
    timer = setInterval(advance, intervalMs);
  }

  function stop() {
    running = false;
    clearInterval(timer);
  }

  toggleBtn.addEventListener('click', () => {
    if (running) {
      stop();
      toggleBtn.textContent = '再開';
    } else {
      start();
    }
  });

  textToggleBtn.addEventListener('click', () => {
    showText = !showText;
    textToggleBtn.textContent = showText ? '文字表示 OFF' : '文字表示 ON';
    applyTextVisibility();
  });

  backBtn.addEventListener('click', () => {
    stop();
    trainingEl.style.display = 'none';
    setupEl.style.display = 'flex';
  });

  window.addEventListener('resize', () => {
    if (trainingEl.style.display !== 'none' && !isDone && charEl.textContent) {
      fitTextToStage();
    }
  });

  startSetupBtn.addEventListener('click', () => {
    hintEl.textContent = '';

    intervalMs = parseInt(intervalSelect.value, 10);
    readMode = readModeSelect.value;
    speechRate = parseFloat(rateSelect.value);

    const checkedTypes = Array.from(typeGroup.querySelectorAll('input[type="checkbox"]:checked'))
      .map(cb => cb.value);

    if (checkedTypes.length === 0) {
      hintEl.textContent = '音の種類を1つ以上選択してください。';
      return;
    }

    const checkedMoras = Array.from(moraGroup.querySelectorAll('input[type="checkbox"]:checked'))
      .map(cb => parseInt(cb.value, 10));

    if (checkedMoras.length === 0) {
      hintEl.textContent = 'モーラ数を1つ以上選択してください。';
      return;
    }

    const basePool = poolForCheckedTypes(checkedTypes);
    const pool = basePool
      .filter(([word, moraCount]) => checkedMoras.some(v => (v === 7 ? moraCount >= 7 : moraCount === v)))
      .map(([word]) => word);

    if (pool.length === 0) {
      hintEl.textContent = '条件に合う単語がありません。条件を見直してください。';
      return;
    }

    const count = parseInt(countSelect.value, 10);
    order = generateSequence(pool, count);
    index = 0;
    toggleBtn.disabled = false;
    showText = true;
    textToggleBtn.textContent = '文字表示 OFF';

    setupEl.style.display = 'none';
    trainingEl.style.display = 'flex';

    render();
    start();
  });
</script>

</body>
</html>
