<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トレーニング">
<title>トレーニングアプリ一覧</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7f8;--card:#fff;--ink:#27343b;--sub:#6b7b84;--teal:#1f8a8a;--gold:#d9a21b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191c;--card:#1e262a;--ink:#e8eef0;--sub:#93a3ab;--teal:#4fc1c1}}
:root[data-theme="dark"]{--bg:#14191c;--card:#1e262a;--ink:#e8eef0;--sub:#93a3ab;--teal:#4fc1c1}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;touch-action:manipulation}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:22px;color:var(--teal);text-align:center;margin:8px 0 20px}
h2{font-size:16px;color:var(--sub);margin:24px 4px 4px}
a.app{display:block;background:var(--card);border-left:8px solid var(--gold);border-radius:14px;padding:18px 16px;margin:12px 0;text-decoration:none;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
a.app b{display:block;font-size:20px}
a.app span{font-size:14px;color:var(--sub)}
</style>
</head>
<body>
<main>
 <h1>トレーニングアプリ一覧</h1>
 <div id="list"></div>
</main>
<script>
/* アプリを増やすときは、該当するグループの items に1行追加するだけです。
   file にはアップロードしたHTMLファイル名を、そのまま書いてください。 */
const GROUPS=[
 {title:"注意・脳トレ",items:[
  {name:"数字つなぎ",desc:"数字を順番にタッチ。ヒントあり・なしを選べます",file:"trail_making.html"},
  {name:"トランプ ワンバック",desc:"トランプの数字とマークを覚えて判断",file:"trump_oneback.html"},
  {name:"記号 ワンバック",desc:"記号の形・色を覚えて判断",file:"kigou_oneback.html"},
  {name:"ドット消失",desc:"消えたドットの位置をタッチ。象限別の正答率を表示",file:"attention_dot.html"},
  {name:"ドリップ・タイミング",desc:"注文に合わせて飲み物を淹れる。適量で止めるタイミングの課題",file:"drip-timing.html"}
 ]},
 {title:"言語",items:[
  {name:"単語の復唱",desc:"聞いた単語を繰り返して言う練習",file:"tango_fukusho.html"},
  {name:"並び替え",desc:"文字や語を並べ替える課題",file:"narabikae.html"},
  {name:"五十音の音読",desc:"ひらがなの音読練習",file:"gojuon_full.html"},
  {name:"聴理解トレーニング",desc:"聞いた言葉の絵を選ぶ課題",file:"takatsuki_foodanimal_flexible.html"}
 ]}
];
document.getElementById("list").innerHTML=GROUPS.map(g=>
 `<h2>${g.title}</h2>`+g.items.map(a=>
 `<a class="app" href="${a.file}"><b>${a.name}</b><span>${a.desc}</span></a>`).join("")).join("");
</script>
</body>
</html>
