<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="注意課題">
<title>注意課題：消えたドットをタッチ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f7f8;--card:#fff;--ink:#27343b;--sub:#6b7b84;--teal:#1f8a8a;--gold:#d9a21b;--ok:#2e9e5b;--ng:#d6453d;--dot:#1f8a8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191c;--card:#1e262a;--ink:#e8eef0;--sub:#93a3ab;--dot:#4fc1c1}}
:root[data-theme="dark"]{--bg:#14191c;--card:#1e262a;--ink:#e8eef0;--sub:#93a3ab;--dot:#4fc1c1}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.screen{display:none;height:100%;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:16px}
.screen.on{display:flex}
.card{background:var(--card);border-radius:16px;padding:24px;max-width:480px;width:100%;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{font-size:22px;margin:0 0 16px;color:var(--teal);text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:17px;gap:12px}
select{font-size:18px;padding:8px 10px;border-radius:8px;border:1px solid var(--sub);background:var(--bg);color:var(--ink)}
button{font-size:20px;font-weight:700;border:0;border-radius:12px;padding:14px 24px;background:var(--teal);color:#fff;width:100%;margin-top:12px}
button.sub{background:var(--sub);font-size:15px;padding:8px 14px;width:auto;margin:0}
#game{padding:0;gap:0;justify-content:flex-start}
#bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;box-sizing:border-box;font-size:15px;color:var(--sub)}
#grid{flex:1;width:100%;display:grid;padding:8px;box-sizing:border-box;min-height:0}
.cell{display:flex;align-items:center;justify-content:center;position:relative}
.dot{width:70%;aspect-ratio:1;border-radius:50%;background:var(--dot);max-height:70%;pointer-events:none;transition:opacity .08s}
.dot.gone{opacity:0}
.cell.ok::after,.cell.ng::after{content:"";position:absolute;width:76%;aspect-ratio:1;max-height:76%;border-radius:50%;box-sizing:border-box;border:6px solid var(--ok)}
.cell.ng::after{border-color:var(--ng)}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.q{background:var(--bg);border-radius:12px;padding:14px 6px;text-align:center}
.q b{display:block;font-size:30px;color:var(--teal)}
.q span{font-size:14px;color:var(--sub)}
.sum{text-align:center;font-size:16px;color:var(--sub);line-height:1.7}
</style>
</head>
<body>
<div id="setup" class="screen on">
 <div class="card">
  <h1>消えたドットをタッチ</h1>
  <div class="row"><label for="rows">縦の列数</label><select id="rows"><option>2</option><option>4</option><option selected>6</option><option>8</option></select></div>
  <div class="row"><label for="cols">横の列数</label><select id="cols"><option>8</option><option selected>12</option><option>16</option><option>20</option></select></div>
  <div class="row"><label for="layout">ドットの配列<br><small style="color:var(--sub)">ランダムは「縦×横」の数だけ、ばらばらに配置</small></label><select id="layout"><option value="grid" selected>等間隔</option><option value="rand">ランダム</option></select></div>
  <div class="row"><label for="trials">試行回数</label><select id="trials"><option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option></select></div>
  <div class="row"><label for="interval">消えるまでの間隔<br><small style="color:var(--sub)">タッチしてから次のドットが消えるまで</small></label><select id="interval"><option value="0.5">0.5秒</option><option value="1">1秒</option><option value="2">2秒</option><option value="3">3秒</option><option value="4">4秒</option><option value="5">5秒</option><option value="rand" selected>ランダム（0.5・1・2・3・4・5秒）</option></select></div>
  <div class="row"><label for="fb">正解・不正解の表示</label><select id="fb"><option value="on" selected>あり</option><option value="off">なし</option></select></div>
  <button id="start">スタート</button>
 </div>
</div>

<div id="game" class="screen">
 <div id="bar"><span id="prog"></span><button class="sub" id="stop">中止</button></div>
 <div id="grid"></div>
</div>

<div id="result" class="screen">
 <div class="card">
  <h1>結果</h1>
  <div class="sum" id="sum"></div>
  <div class="quad" id="quad"></div>
  <button id="again">もう一度</button>
 </div>
</div>

<script>
(function(){
["gesturestart","gesturechange","gestureend","dblclick","contextmenu"].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener("touchmove",e=>{if(e.touches.length>1||e.target.closest("#grid"))e.preventDefault()},{passive:false});
let lastEnd=0;document.addEventListener("touchend",e=>{const n=Date.now();if(n-lastEnd<350&&!e.target.closest("select,button"))e.preventDefault();lastEnd=n},{passive:false});
const $=id=>document.getElementById(id);
const show=id=>{["setup","game","result"].forEach(s=>$(s).classList.toggle("on",s===id))};
let R,C,N,IV,FB,log,idx,targets,cur,timer,fb,t0,locked,active;
const QN={TL:"左上",TR:"右上",BL:"左下",BR:"右下"};

let items=[],mode="grid";
const PAD=8;
function randomPoints(n,W,H){
  let dmin=Math.sqrt(W*H/n)*0.8;
  for(let k=0;k<80;k++){
    const m=dmin*0.5,pts=[];
    for(let t=0;t<4000&&pts.length<n;t++){
      const x=m+Math.random()*Math.max(1,W-2*m),y=m+Math.random()*Math.max(1,H-2*m);
      if(pts.every(p=>(p.x-x)**2+(p.y-y)**2>=dmin*dmin))pts.push({x,y});
    }
    if(pts.length===n)return {pts,d:dmin};
    dmin*=0.95;
  }
  return null;
}
function build(){
  const g=$("grid");g.innerHTML="";items=[];
  if(mode==="grid"){
    g.style.display="";g.style.position="";
    g.style.gridTemplateColumns=`repeat(${C},1fr)`;g.style.gridTemplateRows=`repeat(${R},1fr)`;
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      const d=document.createElement("div");d.className="cell";d.dataset.i=items.length;
      d.innerHTML='<div class="dot"></div>';
      g.appendChild(d);items.push({el:d,q:(r<R/2?"T":"B")+(c<C/2?"L":"R")});
    }
  }else{
    g.style.display="block";g.style.position="relative";
    g.style.gridTemplateColumns="";g.style.gridTemplateRows="";
    const W=g.clientWidth-2*PAD,H=g.clientHeight-2*PAD;
    const res=randomPoints(R*C,W,H);
    if(!res){mode="grid";return build()}   /* 配置できない場合は等間隔に切り替え */
    const size=res.d*0.95;
    res.pts.forEach(p=>{
      const d=document.createElement("div");d.className="cell";
      d.style.cssText=`position:absolute;width:${size}px;height:${size}px;left:${PAD+p.x-size/2}px;top:${PAD+p.y-size/2}px`;
      d.innerHTML='<div class="dot"></div>';
      g.appendChild(d);items.push({el:d,x:PAD+p.x,y:PAD+p.y,q:(p.y<H/2?"T":"B")+(p.x<W/2?"L":"R")});
    });
  }
}
function hit(e){
  if(mode==="grid"){const c=e.target.closest(".cell");return c?+c.dataset.i:-1}
  const rc=$("grid").getBoundingClientRect(),x=e.clientX-rc.left,y=e.clientY-rc.top;
  let best=-1,bd=Infinity;
  items.forEach((it,i)=>{const d=(it.x-x)**2+(it.y-y)**2;if(d<bd){bd=d;best=i}});
  return best;
}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(0,i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function makeTargets(){
  const qs=shuffle(["TL","TR","BL","BR"]),list=[];   /* 試行数が4の倍数でなくても、多い象限は毎回ランダム */
  for(let i=0;i<N;i++)list.push(qs[i%4]);
  shuffle(list);
  const by={};items.forEach((it,i)=>(by[it.q]=by[it.q]||[]).push(i));
  return list.map(q=>{const a=by[q]&&by[q].length?by[q]:items.map((_,i)=>i);return a[rnd(0,a.length)]});
}
function begin(){
  R=+$("rows").value;C=+$("cols").value;N=+$("trials").value;IV=$("interval").value;FB=$("fb").value==="on";
  mode=$("layout").value;
  log=[];idx=0;active=true;show("game");
  build();targets=makeTargets();next();
}
/* 消えるまでの間隔：タッチ（最初の1回はスタート）から次のドットが消えるまで */
const RAND_SET=[0.5,1,2,3,4,5];   /* ランダム：この6つの間隔から毎回1つ選ぶ */
function waitMs(){
  return Math.round((IV==="rand"?RAND_SET[rnd(0,RAND_SET.length)]:+IV)*1000);
}
function resetBoard(){
  items.forEach(it=>{it.el.className="cell";it.el.firstChild.classList.remove("gone")});
  $("prog").textContent=`${Math.min(idx+1,N)} / ${N}`;
}
function schedule(){
  locked=true;cur=null;
  const w=waitMs();
  timer=setTimeout(()=>{
    cur=targets[idx];items[cur].el.firstChild.classList.add("gone");
    t0=performance.now();locked=false;
  },w);
  return w;
}
function next(){
  if(!active)return;
  resetBoard();schedule();
}
function tap(i){
  if(locked||cur===null)return;
  locked=true;
  const rt=performance.now()-t0;
  const ok=(i===cur);
  log.push({q:items[cur].q,ok,rt});
  if(FB){
    items[i].el.classList.add(ok?"ok":"ng");
    if(!ok)items[cur].el.classList.add("ok");
  }
  idx++;
  if(idx>=N){timer=setTimeout(finish,FB?700:300);return}
  const w=schedule();               /* 次の消失までの間隔は、今のタッチから数える */
  if(FB){
    /* 判定の表示は最大0.7秒。間隔が短いときは、次のドットが消える前に必ず終える */
    fb=setTimeout(()=>{if(active)resetBoard()},Math.min(700,Math.max(0,w-150)));
  }else resetBoard();
}
function finish(){
  active=false;clearTimeout(timer);clearTimeout(fb);
  const st={TL:[0,0],TR:[0,0],BL:[0,0],BR:[0,0]};
  let okAll=0,rtSum=0;
  log.forEach(l=>{st[l.q][1]++;if(l.ok){st[l.q][0]++;okAll++;rtSum+=l.rt}});
  const pct=(a,b)=>b?Math.round(a/b*100):"-";
  $("sum").innerHTML=`全体の正答率：<b>${pct(okAll,log.length)}%</b>（${okAll}/${log.length}）<br>`+
   `正答時の平均反応時間：${okAll?(rtSum/okAll/1000).toFixed(2)+" 秒":"-"}<br>ドットの配列：${mode==="rand"?"ランダム（"+R*C+"個）":"等間隔（縦"+R+"列 × 横"+C+"列）"}<br>消えるまでの間隔：${IV==="rand"?"ランダム（0.5・1・2・3・4・5秒）":IV+"秒"}<br>正解・不正解の表示：${FB?"あり":"なし"}`;
  $("quad").innerHTML=["TL","TR","BL","BR"].map(q=>
   `<div class="q"><span>${QN[q]}</span><b>${pct(...st[q])}%</b><span>${st[q][0]} / ${st[q][1]}</span></div>`).join("");
  show("result");
}
$("grid").addEventListener("pointerdown",e=>{e.preventDefault();const i=hit(e);if(i>=0)tap(i)});
$("start").onclick=begin;
$("again").onclick=()=>show("setup");
$("stop").onclick=()=>{clearTimeout(timer);clearTimeout(fb);active=false;log.length?finish():show("setup")};
})();
</script>
</body>
</html>
