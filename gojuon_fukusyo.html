<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>五十音・1モーラ表示トレーニング</title>
<style>
  :root {
    --sumi: #1c1c1e;
    --washi: #f7f3e9;
    --shu: #c1440e;
    --ai: #2a4d5e;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--washi);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.02) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0, transparent 40%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    color: var(--sumi);
    overflow: hidden;
  }

  /* ---- setup screen ---- */
  .setup {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3vh;
    background: #fffdf8;
    border: 1px solid rgba(28,28,30,0.2);
    padding: 5vh 6vw;
    min-width: 320px;
  }
  .setup h1 {
    font-size: min(3vw, 3vh, 26px);
    letter-spacing: 0.15em;
    margin: 0 0 1vh 0;
    font-weight: normal;
    color: var(--sumi);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 0.8vh;
    width: 100%;
  }
  .field span {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: min(1.5vw, 1.5vh, 14px);
    letter-spacing: 0.1em;
    color: var(--ai);
  }
  select {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: min(2vw, 2vh, 18px);
    padding: 1vh 1vw;
    border: 1px solid rgba(28,28,30,0.4);
    background: var(--washi);
    color: var(--sumi);
    min-width: 260px;
  }

  /* ---- training screen ---- */
  .training {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stage {
    position: relative;
    width: min(60vw, 60vh);
    height: min(60vw, 60vh);
    border: 1px solid rgba(28,28,30,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fffdf8;
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 2.2%;
    border: 1px solid rgba(28,28,30,0.12);
    pointer-events: none;
  }
  #char {
    font-size: min(32vw, 32vh);
    line-height: 1;
    color: var(--sumi);
    transition: opacity 0.4s ease;
  }
  #char.fade {
    opacity: 0;
  }
  #char.wide {
    font-size: min(21vw, 21vh);
  }
  #char.done-label {
    font-size: min(6vw, 6vh, 48px);
    color: var(--shu);
  }
  .counter {
    margin-top: 3vh;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: min(2vw, 2vh, 20px);
    letter-spacing: 0.15em;
    color: rgba(28,28,30,0.5);
  }
  .controls {
    margin-top: 5vh;
    display: flex;
    gap: 2vw;
  }
  button {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: min(2.4vw, 2.4vh, 22px);
    letter-spacing: 0.1em;
    padding: 1.4vh 3vw;
    border: 1px solid var(--sumi);
    background: transparent;
    color: var(--sumi);
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  button:hover {
    background: var(--sumi);
    color: var(--washi);
  }
  button.primary {
    border-color: var(--shu);
    color: var(--shu);
  }
  button.primary:hover {
    background: var(--shu);
    color: var(--washi);
  }
</style>
</head>
<body>

<div class="setup" id="setup">
  <h1>復唱練習</h1>

  <div class="field">
    <span>種類</span>
    <select id="typeSelect">
      <option value="gojuon">五十音</option>
      <option value="gojuon_no_bilabial">五十音(両唇音を省く)</option>
      <option value="mora">1モーラ(濁音・半濁音・拗音を含む)</option>
      <option value="mora_no_bilabial">1モーラ(両唇音を省く)</option>
    </select>
  </div>

  <div class="field">
    <span>回数</span>
    <select id="countSelect">
      <option value="46">46回</option>
      <option value="100">100回</option>
      <option value="150">150回</option>
      <option value="250">250回</option>
      <option value="500">500回</option>
    </select>
  </div>

  <div class="field">
    <span>間隔</span>
    <select id="intervalSelect">
      <option value="1000">1秒</option>
      <option value="1500">1.5秒</option>
      <option value="2000" selected>2秒</option>
      <option value="2500">2.5秒</option>
      <option value="3000">3秒</option>
      <option value="4000">4秒</option>
      <option value="5000">5秒</option>
    </select>
  </div>

  <button class="primary" id="startSetupBtn">開始</button>
</div>

<div class="training" id="training" style="display:none;">
  <div class="stage">
    <div id="char"></div>
  </div>
  <div class="counter" id="counter"></div>
  <div class="controls">
    <button class="primary" id="toggleBtn">一時停止</button>
    <button id="visibilityBtn">文字を隠す</button>
    <button id="backBtn">設定に戻る</button>
  </div>
</div>

<script>
  // ---- 文字セット定義 ----
  const GOJUON_46 = [
    ["あ","A"],["い","I"],["う","U"],["え","E"],["お","O"],
    ["か","KA"],["き","KI"],["く","KU"],["け","KE"],["こ","KO"],
    ["さ","SA"],["し","SHI"],["す","SU"],["せ","SE"],["そ","SO"],
    ["た","TA"],["ち","CHI"],["つ","TSU"],["て","TE"],["と","TO"],
    ["な","NA"],["に","NI"],["ぬ","NU"],["ね","NE"],["の","NO"],
    ["は","HA"],["ひ","HI"],["ふ","FU"],["へ","HE"],["ほ","HO"],
    ["ま","MA"],["み","MI"],["む","MU"],["め","ME"],["も","MO"],
    ["や","YA"],["ゆ","YU"],["よ","YO"],
    ["ら","RA"],["り","RI"],["る","RU"],["れ","RE"],["ろ","RO"],
    ["わ","WA"],["を","WO"],["ん","N"]
  ];

  const BILABIAL_ROWS_46 = [
    ["ま","MA"],["み","MI"],["む","MU"],["め","ME"],["も","MO"]
  ];

  const MORA_105 = [
    ...GOJUON_46,
    // 濁音
    ["が","GA"],["ぎ","GI"],["ぐ","GU"],["げ","GE"],["ご","GO"],
    ["ざ","ZA"],["じ","JI"],["ず","ZU"],["ぜ","ZE"],["ぞ","ZO"],
    ["だ","DA"],["ぢ","JI"],["づ","ZU"],["で","DE"],["ど","DO"],
    ["ば","BA"],["び","BI"],["ぶ","BU"],["べ","BE"],["ぼ","BO"],
    // 半濁音
    ["ぱ","PA"],["ぴ","PI"],["ぷ","PU"],["ぺ","PE"],["ぽ","PO"],
    // 拗音(清音)
    ["きゃ","KYA"],["きゅ","KYU"],["きょ","KYO"],
    ["しゃ","SHA"],["しゅ","SHU"],["しょ","SHO"],
    ["ちゃ","CHA"],["ちゅ","CHU"],["ちょ","CHO"],
    ["にゃ","NYA"],["にゅ","NYU"],["にょ","NYO"],
    ["ひゃ","HYA"],["ひゅ","HYU"],["ひょ","HYO"],
    ["みゃ","MYA"],["みゅ","MYU"],["みょ","MYO"],
    ["りゃ","RYA"],["りゅ","RYU"],["りょ","RYO"],
    // 拗音(濁音)
    ["ぎゃ","GYA"],["ぎゅ","GYU"],["ぎょ","GYO"],
    ["じゃ","JA"],["じゅ","JU"],["じょ","JO"],
    ["びゃ","BYA"],["びゅ","BYU"],["びょ","BYO"],
    // 拗音(半濁音)
    ["ぴゃ","PYA"],["ぴゅ","PYU"],["ぴょ","PYO"]
  ];

  const BILABIAL_ROWS_105 = [
    ["ま","MA"],["み","MI"],["む","MU"],["め","ME"],["も","MO"],
    ["ば","BA"],["び","BI"],["ぶ","BU"],["べ","BE"],["ぼ","BO"],
    ["ぱ","PA"],["ぴ","PI"],["ぷ","PU"],["ぺ","PE"],["ぽ","PO"],
    ["みゃ","MYA"],["みゅ","MYU"],["みょ","MYO"],
    ["びゃ","BYA"],["びゅ","BYU"],["びょ","BYO"],
    ["ぴゃ","PYA"],["ぴゅ","PYU"],["ぴょ","PYO"]
  ];

  function without(base, exclude) {
    const excludeChars = new Set(exclude.map(x => x[0]));
    return base.filter(x => !excludeChars.has(x[0]));
  }

  const SETS = {
    gojuon: GOJUON_46,
    gojuon_no_bilabial: without(GOJUON_46, BILABIAL_ROWS_46),
    mora: MORA_105,
    mora_no_bilabial: without(MORA_105, BILABIAL_ROWS_105)
  };

  // ---- DOM参照 ----
  const setupEl = document.getElementById('setup');
  const trainingEl = document.getElementById('training');
  const typeSelect = document.getElementById('typeSelect');
  const countSelect = document.getElementById('countSelect');
  const intervalSelect = document.getElementById('intervalSelect');
  const startSetupBtn = document.getElementById('startSetupBtn');
  const charEl = document.getElementById('char');
  const counterEl = document.getElementById('counter');
  const toggleBtn = document.getElementById('toggleBtn');
  const visibilityBtn = document.getElementById('visibilityBtn');
  const backBtn = document.getElementById('backBtn');

  let order = [];
  let index = 0;
  let timer = null;
  let running = false;
  let intervalMs = 2000;
  let charVisible = true;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 指定回数分のランダム順シーケンスを生成(セットを使い切ったら再シャッフルして継続)
  function generateSequence(baseArray, count) {
    let seq = [];
    while (seq.length < count) {
      seq = seq.concat(shuffle(baseArray));
    }
    return seq.slice(0, count);
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }

  function applyVisibility() {
    charEl.style.visibility = charVisible ? 'visible' : 'hidden';
  }

  function render() {
    const [char] = order[index];
    charEl.classList.add('fade');
    setTimeout(() => {
      charEl.classList.remove('done-label');
      charEl.textContent = char;
      charEl.classList.toggle('wide', char.length > 1);
      charEl.classList.remove('fade');
      applyVisibility();
      speak(char);
    }, 200);
    counterEl.textContent = `${index + 1} / ${order.length}`;
  }

  function advance() {
    if (index < order.length - 1) {
      index++;
      render();
    } else {
      stop();
      charEl.classList.remove('fade', 'wide');
      charEl.classList.add('done-label');
      charEl.textContent = '完了';
      charEl.style.visibility = 'visible';
      toggleBtn.textContent = '開始';
      toggleBtn.disabled = true;
    }
  }

  function start() {
    running = true;
    toggleBtn.disabled = false;
    toggleBtn.textContent = '一時停止';
    timer = setInterval(advance, intervalMs);
  }

  function stop() {
    running = false;
    clearInterval(timer);
  }

  toggleBtn.addEventListener('click', () => {
    if (running) {
      stop();
      toggleBtn.textContent = '再開';
    } else {
      start();
    }
  });

  visibilityBtn.addEventListener('click', () => {
    charVisible = !charVisible;
    visibilityBtn.textContent = charVisible ? '文字を隠す' : '文字を表示';
    applyVisibility();
  });

  backBtn.addEventListener('click', () => {
    stop();
    trainingEl.style.display = 'none';
    setupEl.style.display = 'flex';
  });

  startSetupBtn.addEventListener('click', () => {
    const type = typeSelect.value;
    const count = parseInt(countSelect.value, 10);
    intervalMs = parseInt(intervalSelect.value, 10);

    order = generateSequence(SETS[type], count);
    index = 0;
    toggleBtn.disabled = false;
    charVisible = true;
    visibilityBtn.textContent = '文字を隠す';

    setupEl.style.display = 'none';
    trainingEl.style.display = 'flex';

    render();
    start();
  });
</script>

</body>
</html>
