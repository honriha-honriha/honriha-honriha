<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ひらがな たんごならべ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --paper:#F7F1E3;
    --paper-line: rgba(34,49,79,0.06);
    --ink:#22314F;
    --ink-soft:#5A6B8C;
    --hanko:#B3312C;
    --hanko-deep:#8E2620;
    --gold:#C7A34C;
    --gold-soft:#E8D9AE;
    --ok:#4C7A5B;
    --card:#FFFDF8;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 28px);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    min-height:100vh;
    padding:20px 14px 60px;
  }
  h1,h2,.big-char{font-family:'Zen Maru Gothic', sans-serif;}

  .wrap{max-width:640px;margin:0 auto;}

  header{text-align:center;margin-bottom:18px;}
  header h1{
    font-size:26px;
    font-weight:900;
    margin:0 0 4px;
    letter-spacing:.02em;
    color:var(--ink);
  }
  header .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:0;
  }

  .mode-select{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .mode-btn{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:14px 8px;
    border-radius:var(--radius);
    border:2px solid transparent;
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
    box-shadow:0 1px 2px rgba(34,49,79,0.08);
    transition:transform .15s ease, border-color .15s ease, color .15s ease;
  }
  .mode-btn small{display:block;font-family:'Noto Sans JP';font-weight:400;font-size:11px;margin-top:3px;}
  .mode-btn.active{
    border-color:var(--hanko);
    color:var(--hanko-deep);
    transform:translateY(-1px);
  }
  .mode-btn:active{transform:scale(0.97);}

  .cat-select{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:18px;
  }
  .chip{
    font-family:'Zen Maru Gothic';
    font-weight:700;
    font-size:14px;
    padding:7px 14px;
    border-radius:999px;
    border:1.5px solid var(--gold-soft);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  .chip.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#fff;
  }

  .panel{
    background:var(--card);
    border-radius:20px;
    padding:22px 14px 22px;
    box-shadow:0 2px 10px rgba(34,49,79,0.07);
    position:relative;
    overflow:hidden;
  }

  .hint{
    text-align:center;
    margin-bottom:14px;
  }
  .hint .cat-tag{
    display:inline-block;
    font-size:11px;
    color:var(--gold);
    border:1px solid var(--gold-soft);
    padding:2px 10px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .illustration{
    width:150px;
    height:150px;
    border-radius:50%;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,0.5);
  }
  .illustration .emoji-display{
    font-size:76px;
    line-height:1;
  }

  .hint-row{
    display:flex;
    justify-content:center;
  }
  .board-row{
    display:flex;
    justify-content:center;
  }
  .illustration-wrap, .board-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
  }
  .speaker-btn.illust-speaker{
    position:absolute;
    right:100%;
    top:50%;
    transform:translateY(-50%);
    margin-right:12px;
  }
  .board-wrap{
    max-width:calc(100% - 116px);
  }
  .speaker-btn.illust-speaker:active{
    transform:translateY(-50%) scale(0.92);
  }

  @media (max-width: 480px){
    .board-row{
      flex-direction:column;
      gap:8px;
    }
    .board-wrap{
      flex-direction:column;
      max-width:100%;
      width:100%;
    }
    .board-row .speaker-btn.illust-speaker{
      position:static;
      transform:none;
      margin:0;
    }
    .board-row .speaker-btn.illust-speaker:active{
      transform:scale(0.92);
    }
    .board .cell, .bank .tile{
      width:42px;
      height:42px;
      font-size:19px;
    }
    .board{
      gap:5px;
    }
    .bank{
      gap:6px;
    }
  }
  .speaker-btn{
    width:46px;
    height:46px;
    border-radius:50%;
    border:2px solid var(--gold);
    background:var(--card);
    color:var(--hanko-deep);
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:0 1px 4px rgba(34,49,79,0.15);
  }
  .speaker-btn:active{transform:scale(0.92);}

  .progress{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:16px;
    font-weight:500;
  }
  .progress b{color:var(--hanko-deep);}

  .board{
    display:flex;
    gap:6px;
    justify-content:center;
    margin:0 auto 18px;
    flex-wrap:wrap;
  }
  .cell{
    width:52px;
    height:52px;
    border:2px solid var(--gold-soft);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:700;
    color:var(--ink);
    background:#fff;
    position:relative;
    transition:border-color .15s ease, background .15s ease;
  }
  .cell.filled{cursor:grab;border-color:var(--ink-soft);touch-action:none;}
  .cell.drop-hover{border-color:var(--hanko);background:#FFF4E8;}
  .cell.dragging-source{opacity:0.3;}
  .cell.correct{
    border-color:var(--ok);
    background:#EFF6F1;
    color:var(--ok);
  }
  .cell.wrong{
    border-color:var(--hanko);
    background:#FBEBEA;
    color:var(--hanko-deep);
  }

  .bank-label{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .bank{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    min-height:52px;
    padding:8px;
    border-radius:12px;
    background:var(--paper);
  }
  .tile{
    width:46px;
    height:46px;
    border-radius:10px;
    border:2px solid var(--ink);
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:700;
    color:var(--ink);
    cursor:grab;
    touch-action:none;
    transition:transform .1s ease, opacity .1s ease;
  }
  .tile.dragging-source{opacity:0.3;}
  .drag-ghost{
    position:fixed;
    pointer-events:none;
    z-index:9999;
    opacity:0.9;
    transform:scale(1.1);
    box-shadow:0 4px 12px rgba(34,49,79,0.3);
  }
  .tile:active{transform:scale(0.92);}

  .actions{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .action-btn{
    font-family:'Zen Maru Gothic';
    font-weight:700;
    font-size:14px;
    padding:10px 18px;
    border-radius:999px;
    border:none;
    cursor:pointer;
  }
  .action-btn.primary{background:var(--hanko);color:#fff;}
  .action-btn.secondary{background:transparent;color:var(--ink-soft);border:1.5px solid var(--gold-soft);}
  .action-btn.next{background:var(--ok);color:#fff; display:none;}
  .action-btn:active{transform:scale(0.96);}

  .stamp-overlay{
    position:absolute;
    top:10px;
    right:10px;
    display:flex;
    pointer-events:none;
    opacity:0;
    z-index:6;
  }
  .stamp-overlay.show{
    animation:stampIn .5s ease forwards;
  }
  .stamp{
    width:88px;
    height:88px;
    border-radius:50%;
    border:5px solid var(--hanko);
    color:var(--hanko);
    font-family:'Zen Maru Gothic';
    font-weight:900;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:rgba(255,253,248,0.95);
    transform:rotate(-10deg);
    box-shadow:0 0 0 3px rgba(179,49,44,0.15);
  }
  @keyframes stampIn{
    0%{opacity:0; transform:scale(1.6) rotate(-8deg);}
    60%{opacity:1; transform:scale(0.95) rotate(-8deg);}
    80%{transform:scale(1.05) rotate(-8deg);}
    100%{opacity:1; transform:scale(1) rotate(-8deg);}
  }
  @media (prefers-reduced-motion: reduce){
    .stamp-overlay.show{animation:none; opacity:1;}
    .tile, .mode-btn, .action-btn{transition:none;}
  }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:24px;
    opacity:.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ひらがな たんごならべ</h1>
    <p class="sub">バラバラの文字から ことばを つくろう</p>
  </header>

  <div class="mode-select">
    <button class="mode-btn active" id="modeLessonBtn">レッスンモード<small>カテゴリーごとに練習</small></button>
    <button class="mode-btn" id="modeRandomBtn">ランダムモード<small>すべてのことば</small></button>
  </div>

  <div class="cat-select" id="catSelect"></div>

  <div class="panel" id="panel">
    <div class="stamp-overlay" id="stampOverlay"><div class="stamp">よく<br>できました</div></div>
    <div class="hint">
      <div class="cat-tag" id="catTag"></div>
      <div class="hint-row">
        <div class="illustration-wrap">
          <button class="speaker-btn illust-speaker" id="speakerBtn" aria-label="こたえの読み上げ">🔊</button>
          <div class="illustration" id="illustration"></div>
        </div>
      </div>
    </div>
    <div class="progress" id="progress"></div>
    <div class="board-row">
      <div class="board-wrap">
        <button class="speaker-btn illust-speaker" id="speakerBtn2" aria-label="ならべた文字の読み上げ">🔊</button>
        <div class="board" id="board"></div>
      </div>
    </div>
    <div class="bank-label">タイルをドラッグして順番にならべよう</div>
    <div class="bank" id="bank"></div>
    <div class="actions">
      <button class="action-btn secondary" id="shuffleBtn">元に戻す</button>
      <button class="action-btn primary" id="checkBtn">答え合わせ</button>
      <button class="action-btn next" id="nextBtn">つぎのことば →</button>
    </div>
  </div>

  <footer>タイルをドラッグして配置 → マスの外に出すと戻せます</footer>
</div>

let state = {
  mode: 'lesson',       // 'lesson' | 'random'
  catKey: 'animal',
  queue: [],             // shuffled list of word-entries left to play (lesson: within category, random: all)
  current: null,         // current word entry {word, meaning, catLabel}
  slots: [],
  bank: [],
  initialOrder: [],      // the shuffled order shown when the word first loaded
  solved: false,
};

const catSelect = document.getElementById('catSelect');
const boardEl = document.getElementById('board');
const bankEl = document.getElementById('bank');
const progressEl = document.getElementById('progress');
const illustrationEl = document.getElementById('illustration');
const catTagEl = document.getElementById('catTag');
const speakerBtn = document.getElementById('speakerBtn');
const speakerBtn2 = document.getElementById('speakerBtn2');
const stampOverlay = document.getElementById('stampOverlay');
const modeLessonBtn = document.getElementById('modeLessonBtn');
const modeRandomBtn = document.getElementById('modeRandomBtn');
const nextBtn = document.getElementById('nextBtn');
const checkBtn = document.getElementById('checkBtn');
const shuffleBtn = document.getElementById('shuffleBtn');

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = 0.85;
  window.speechSynthesis.speak(utter);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildCatSelect(){
  catSelect.innerHTML = '';
  CATEGORIES.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'chip' + (c.key===state.catKey ? ' active':'');
    b.textContent = c.label;
    b.onclick = ()=>{ state.catKey = c.key; buildQueue(); startWord(); buildCatSelect(); };
    catSelect.appendChild(b);
  });
}

function buildQueue(){
  if(state.mode === 'lesson'){
    const cat = CATEGORIES.find(c=>c.key===state.catKey);
    state.queue = shuffle(cat.words.map(w=>({...w, catLabel:cat.label, catBg:cat.bg})));
  } else {
    const all = [];
    CATEGORIES.forEach(c=> c.words.forEach(w=> all.push({...w, catLabel:c.label, catBg:c.bg})));
    state.queue = shuffle(all);
  }
}

function startWord(){
  if(state.queue.length === 0) buildQueue();
  state.current = state.queue.shift();
  const letters = Array.from(state.current.word);
  state.slots = letters.map(l=>({answer:l, placedChar:null, flag:null}));
  state.initialOrder = shuffle(letters);
  state.bank = state.initialOrder.map(c=>({char:c, used:false}));
  state.solved = false;
  stampOverlay.classList.remove('show');
  nextBtn.style.display = 'none';
  checkBtn.style.display = 'inline-block';
  render();
}

function render(){
  catTagEl.textContent = state.current.catLabel;
  illustrationEl.style.background = state.current.catBg;
  illustrationEl.setAttribute('aria-label', state.current.meaning);
  illustrationEl.innerHTML = `<span class="emoji-display">${EMOJI[state.current.word] || '❔'}</span>`;
  renderBoard();
  renderBank();
  renderProgress();
}

function renderBoard(){
  boardEl.innerHTML = '';
  state.slots.forEach((slot, idx)=>{
    const cell = document.createElement('div');
    cell.className = 'cell ' + (slot.placedChar ? 'filled' : '');
    if(slot.flag==='correct') cell.classList.add('correct');
    if(slot.flag==='wrong') cell.classList.add('wrong');
    cell.dataset.slot = idx;
    cell.textContent = slot.placedChar || '';
    if(slot.placedChar){
      cell.onpointerdown = (e)=> startDrag(e, 'slot', idx, slot.placedChar, cell);
    }
    boardEl.appendChild(cell);
  });
}

function renderBank(){
  bankEl.innerHTML = '';
  state.bank.forEach((item, i)=>{
    if(item.used) return;
    const t = document.createElement('div');
    t.className = 'tile';
    t.textContent = item.char;
    t.onpointerdown = (e)=> startDrag(e, 'bank', i, item.char, t);
    bankEl.appendChild(t);
  });
}

function renderProgress(){
  const catLen = state.mode==='lesson'
    ? CATEGORIES.find(c=>c.key===state.catKey).words.length
    : CATEGORIES.reduce((s,c)=>s+c.words.length,0);
  const done = catLen - state.queue.length; // includes current word as "in progress" count
  progressEl.innerHTML = `<b>${done}</b> / ${catLen} ことば`;
}

let dragState = null;

function startDrag(e, sourceType, sourceIndex, char, originEl){
  if(state.solved) return;
  if(sourceType==='bank' && state.bank[sourceIndex].used) return;
  e.preventDefault();
  dragState = {sourceType, sourceIndex, char};
  const ghost = document.createElement('div');
  ghost.className = (sourceType==='bank' ? 'tile' : 'cell filled') + ' drag-ghost';
  ghost.textContent = char;
  document.body.appendChild(ghost);
  dragState.ghost = ghost;
  positionGhost(e.clientX, e.clientY);
  originEl.classList.add('dragging-source');
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd, {once:true});
}

function positionGhost(x, y){
  if(!dragState || !dragState.ghost) return;
  const g = dragState.ghost;
  g.style.left = (x - g.offsetWidth/2) + 'px';
  g.style.top = (y - g.offsetHeight/2) + 'px';
}

function onDragMove(e){
  if(!dragState) return;
  positionGhost(e.clientX, e.clientY);
  document.querySelectorAll('.cell.drop-hover').forEach(c=>c.classList.remove('drop-hover'));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const cell = el && el.closest('.cell');
  if(cell && cell.dataset.slot !== undefined) cell.classList.add('drop-hover');
}

function onDragEnd(e){
  document.removeEventListener('pointermove', onDragMove);
  document.querySelectorAll('.cell.drop-hover').forEach(c=>c.classList.remove('drop-hover'));
  if(!dragState) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const cell = el && el.closest('.cell');
  if(cell && cell.dataset.slot !== undefined){
    dropOnSlot(parseInt(cell.dataset.slot, 10));
  } else if(dragState.sourceType === 'slot'){
    returnSlotToBank(dragState.sourceIndex);
  }
  if(dragState.ghost) dragState.ghost.remove();
  dragState = null;
  render();
}

function dropOnSlot(targetIdx){
  if(state.solved) return;
  const { sourceType, sourceIndex } = dragState;
  if(sourceType === 'bank'){
    const existing = state.slots[targetIdx].placedChar;
    if(existing){
      const item = state.bank.find(b=>b.used && b.char===existing);
      if(item) item.used = false;
    }
    const ch = state.bank[sourceIndex].char;
    state.slots[targetIdx].placedChar = ch;
    state.slots[targetIdx].flag = null;
    state.bank[sourceIndex].used = true;
    speak(ch);
  } else if(sourceType === 'slot'){
    if(sourceIndex === targetIdx) return;
    const temp = state.slots[targetIdx].placedChar;
    state.slots[targetIdx].placedChar = state.slots[sourceIndex].placedChar;
    state.slots[targetIdx].flag = null;
    state.slots[sourceIndex].placedChar = temp;
    state.slots[sourceIndex].flag = null;
    speak(state.slots[targetIdx].placedChar);
  }
}

function returnSlotToBank(slotIdx){
  const ch = state.slots[slotIdx].placedChar;
  state.slots[slotIdx].placedChar = null;
  state.slots[slotIdx].flag = null;
  const bankItem = state.bank.find(b=>b.used && b.char===ch);
  if(bankItem) bankItem.used = false;
}

function checkAnswers(){
  let allCorrect = true;
  const wrongSlots = [];
  state.slots.forEach((s, idx)=>{
    if(!s.placedChar){ s.flag = null; allCorrect = false; return; }
    if(s.placedChar === s.answer){ s.flag = 'correct'; }
    else { s.flag = 'wrong'; wrongSlots.push(idx); allCorrect = false; }
  });
  render();
  if(allCorrect){
    state.solved = true;
    stampOverlay.classList.add('show');
    nextBtn.style.display = 'inline-block';
    checkBtn.style.display = 'none';
  } else if(wrongSlots.length){
    setTimeout(()=> returnWrongTiles(wrongSlots), 700);
  }
}

function returnWrongTiles(slotIndices){
  const bankRect = bankEl.getBoundingClientRect();
  slotIndices.forEach(idx=>{
    const cellEl = boardEl.querySelector(`[data-slot="${idx}"]`);
    const ch = state.slots[idx].placedChar;
    if(!cellEl || !ch) return;
    const rect = cellEl.getBoundingClientRect();

    const clone = document.createElement('div');
    clone.className = 'tile drag-ghost';
    clone.textContent = ch;
    clone.style.position = 'fixed';
    clone.style.left = rect.left + (rect.width-46)/2 + 'px';
    clone.style.top = rect.top + (rect.height-46)/2 + 'px';
    clone.style.transform = 'none';
    clone.style.transition = 'left 0.8s ease, top 0.8s ease, opacity 0.8s ease';
    document.body.appendChild(clone);

    cellEl.textContent = '';
    cellEl.classList.remove('filled','wrong');
    delete cellEl.onpointerdown;
    state.slots[idx].placedChar = null;
    state.slots[idx].flag = null;

    requestAnimationFrame(()=>{
      clone.style.left = bankRect.left + 10 + 'px';
      clone.style.top = bankRect.top + 10 + 'px';
      clone.style.opacity = '0.4';
    });
    setTimeout(()=>{
      clone.remove();
      const bankItem = state.bank.find(b=> b.char===ch && b.used);
      if(bankItem) bankItem.used = false;
      render();
    }, 820);
  });
}

speakerBtn.onclick = ()=> speak(state.current.word);
speakerBtn2.onclick = ()=>{
  const placed = state.slots.map(s=>s.placedChar).filter(Boolean).join('');
  if(placed) speak(placed);
};

shuffleBtn.onclick = ()=>{
  state.slots.forEach(s=>{ s.placedChar=null; s.flag=null; });
  state.bank = state.initialOrder.map(c=>({char:c, used:false}));
  stampOverlay.classList.remove('show');
  render();
};
checkBtn.onclick = checkAnswers;
nextBtn.onclick = startWord;

modeLessonBtn.onclick = ()=>{
  state.mode = 'lesson';
  modeLessonBtn.classList.add('active');
  modeRandomBtn.classList.remove('active');
  catSelect.style.display = 'flex';
  buildQueue();
  startWord();
};
modeRandomBtn.onclick = ()=>{
  state.mode = 'random';
  modeRandomBtn.classList.add('active');
  modeLessonBtn.classList.remove('active');
  catSelect.style.display = 'none';
  buildQueue();
  startWord();
};

buildCatSelect();
buildQueue();
startWord();
</script>
